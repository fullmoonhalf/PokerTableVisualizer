<!DOCTYPE html>
<html>
    <head>
        <link type="text/css" rel="stylesheet" href="./style.css">
        <link type="text/css" rel="stylesheet" href="./style_dealer_control.css">
        <link type="text/css" rel="stylesheet" href="./style_dealer_view.css">
        <link type="text/css" rel="stylesheet" href="./style_player_control.css">
        <link type="text/css" rel="stylesheet" href="./style_player_view.css">
        <script src="./HtmlUtil.js" type="text/javascript"></script>
        <script src="./winrate.js" type="text/javascript"></script>
        <script src="./PokerModel.js" type="text/javascript"></script>
        <script src="./PokerBrowserEngine.js" type="text/javascript"></script>
        <title>Poker Table Monitor Browser</title>
    </head>
    <body>
        <div class="poker_browser">
            <div class="poker_browser_control">
                <div>
                    <p>commands</p>
                    <button id="command_deal_hand">Deal Hand</button>
                    <button id="command_fix_hand">Fix Hand</button><br>
                    <button id="command_start_flop">Start Flop</button>
                    <button id="command_start_turn">Start Turn</button>
                    <button id="command_start_river">Start River</button><br>
                    <button id="command_end_hand">End Hand</button><br>
                    <button id="command_probe_add">プローブ追加</button>
                    <p>
                        <div id="template_panel_dealer_control" class="template_panel_dealer_probe_base">
                            <div class="template_panel_dealer_probe_name_label">Board</div>
                            <div class="template_panel_dealer_probe_rssi">Rssi</div>
                            <div class="template_panel_dealer_probe_battery">Battery</div>
                            <div class="template_panel_dealer_probe_hand">Hand</div>
                            <div class="template_panel_dealer_probe_round">Round</div>
                            <button class="template_panel_dealer_probe_blind_update">Up</button>
                            <input class="template_panel_dealer_probe_sb_input">
                            <input class="template_panel_dealer_probe_bb_input">
                            <div class="template_panel_dealer_probe_flop">
                                <img class="template_card_hand" src="../Assets/UI/cards_pc-0.png">
                                <img class="template_card_hand" src="../Assets/UI/cards_pc-0.png">
                                <img class="template_card_hand" src="../Assets/UI/cards_pc-0.png">
                            </div>
                            <div class="template_panel_dealer_probe_turn">
                                <img class="template_card_hand" src="../Assets/UI/cards_pc-0.png">
                            </div>
                            <div class="template_panel_dealer_probe_river">
                                <img class="template_card_hand" src="../Assets/UI/cards_pc-0.png">
                            </div>
                        </div>
                    </p>
                    <div id="screen_management_user_all">
                        <div id="screen_management_user_list">ユーザー一覧
                            <div class="element_panel_probe" id="Seat01"></div>
                            <div class="element_panel_probe" id="Seat02"></div>
                            <div class="element_panel_probe" id="Seat03"></div>
                            <div class="element_panel_probe" id="Seat04"></div>
                            <div class="element_panel_probe" id="Seat05"></div>
                            <div class="element_panel_probe" id="Seat06"></div>
                            <div class="element_panel_probe" id="Seat07"></div>
                            <div class="element_panel_probe" id="Seat08"></div>
                            <div class="element_panel_probe" id="Seat09"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div id="screen_display" class="poker_browser_display">
                display
            </div>
       </div>
        <div class="poker_browser_templates">
            テンプレ
            <p>
                <div id="template_panel_user_current_hand" class="template_panel_user_current_hand_base">
                    <div class="template_panel_user_current_hand_drag">
                        <div class="template_panel_user_current_hand_layout_base">
                            <div class="template_panel_user_current_hand_infos">
                                <div class="template_panel_user_current_hand_value_name">名前</div>
                                <div class="template_panel_user_current_hand_value_position">ポジション</div>
                                <div class="template_panel_user_current_hand_value_winrate">勝率</div>
                            </div>
                            <div class="template_panel_user_current_hand_value_hand">
                                <img class="template_card_hand" src="../Assets/UI/cards_pc-0.png">
                                <img class="template_card_hand" src="../Assets/UI/cards_pc-0.png">
                            </div>
                        </div>
                    </div>
                </div>
            </p>
            <p>
                <div id="template_panel_probe" class="template_panel_probe_base">
                    <div class="template_panel_probe_value_seat">
                        <div class="template_panel_probe_value_seat_id_value">ID</div>
                        <div class="template_panel_probe_value_rssi">Rssi</div>
                        <div class="template_panel_probe_value_battery">Battery</div>
                        <input class="template_panel_probe_value_seat_name_input">
                    </div>
                    <div class="template_panel_probe_value_hand">
                        <img class="template_card_hand_small" src="../Assets/UI/cards_pc-0.png">
                        <img class="template_card_hand_small" src="../Assets/UI/cards_pc-0.png">
                    </div>
                    <button class="template_panel_probe_command_fold">Fold</button>
                    <button class="template_panel_probe_command_allin">All-In</button>
                    <button class="template_panel_probe_command_position">-</button>
                    <button class="template_panel_probe_command_alive">Alive</button>
                </div>
            </p>
            <p>
                <div id="template_panel_dealer_view" class="template_panel_dealer_view_base">
                    <div class="template_panel_dealer_view_drag">
                        <div class="template_panel_dealer_view_layout_base">
                            <div class="template_panel_dealer_view_flop">
                                <img class="template_card_hand" src="../Assets/UI/cards_pc-0.png">
                                <img class="template_card_hand" src="../Assets/UI/cards_pc-0.png">
                                <img class="template_card_hand" src="../Assets/UI/cards_pc-0.png">
                            </div>
                            <div class="template_panel_dealer_view_turn">
                                <img class="template_card_hand" src="../Assets/UI/cards_pc-0.png">
                            </div>
                            <div class="template_panel_dealer_view_river">
                                <img class="template_card_hand" src="../Assets/UI/cards_pc-0.png">
                            </div>
                        </div>
                    </div>
                </div>
            </p>
        </div>
    </body>
</html>
