<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link type="text/css" rel="stylesheet" href="./style.css">
        <link type="text/css" rel="stylesheet" href="./style_develop.css">
        <link type="text/css" rel="stylesheet" href="./style_probe_player.css">
        <link type="text/css" rel="stylesheet" href="./style_probe_dealer.css">
        <link type="text/css" rel="stylesheet" href="./style_monitor_player.css">
        <link type="text/css" rel="stylesheet" href="./style_monitor_dealer.css">
        <!-- 絶対的に優先的に読みたい -->
        <script defer src="./Monitor_Bootstrap.js" type="text/javascript"></script>
        <script defer src="./Monitor_Defines.js" type="text/javascript"></script>
        <!-- 他ライブラリ -->
        <script defer src="./HtmlUtil.js" type="text/javascript"></script>
        <script defer src="./winrate.js" type="text/javascript"></script>
        <script defer src="./PokerModel.js" type="text/javascript"></script>
        <script defer src="./SpeechRecognizer.js" type="text/javascript"></script>
        <!-- カードリスト表示ユーティリティ -->
        <script defer src="./Monitor_CardListView.js" type="text/javascript"></script>
        <!-- ハンドレンジユーティリティ -->
        <script defer src="./Monitor_HandRange.js" type="text/javascript"></script>
        <!-- プレイヤー統計 -->
        <script defer src="./Monitor_PlayerStats.js" type="text/javascript"></script>
        <!-- 基底系 -->
        <script defer src="./Monitor_HtmlBase.js" type="text/javascript"></script>
        <script defer src="./Monitor_ProbeModelBase.js" type="text/javascript"></script>
        <script defer src="./Monitor_ProbeViewBase.js" type="text/javascript"></script>
        <!-- 具体クラス系 -->
        <script defer src="./Monitor_Carddeck.js" type="text/javascript"></script>
        <script defer src="./Monitor_Cardslot.js" type="text/javascript"></script>
        <script defer src="./Monitor_Engine.js" type="text/javascript"></script>
        <script defer src="./Monitor_MonitorManager.js" type="text/javascript"></script>
        <script defer src="./Monitor_ProbeDealerModel.js" type="text/javascript"></script>
        <script defer src="./Monitor_ProbeDealerMonitor.js" type="text/javascript"></script>
        <script defer src="./Monitor_ProbeDealerView.js" type="text/javascript"></script>
        <script defer src="./Monitor_ProbeDeviceManager.js" type="text/javascript"></script>
        <script defer src="./Monitor_ProbeDeviceUnit.js" type="text/javascript"></script>
        <script defer src="./Monitor_ProbeManager.js" type="text/javascript"></script>
        <script defer src="./Monitor_ProbePlayerModel.js" type="text/javascript"></script>
        <script defer src="./Monitor_ProbePlayerMonitor.js" type="text/javascript"></script>
        <script defer src="./Monitor_ProbePlayerView.js" type="text/javascript"></script>
        <script defer src="./Monitor_GuideManager.js" type="text/javascript"></script>
        <script defer src="./Monitor_LevelStructureManager.js" type="text/javascript"></script>
        <script defer src="./Monitor_SpeechRecognizerManager.js" type="text/javascript"></script>
        <script defer src="./Monitor_ViewManager.js" type="text/javascript"></script>
        <script defer src="./Monitor.js" type="text/javascript"></script>
        <title>Poker Table Monitor Browser</title>
    </head>
    <body>
        <p>
            <div class="monitor_root">
                <div class="monitor_mamage">
                    <div class="poker_browser">
                        <div id="CONTAINER_PROBEDEALER_PANEL"></div>
                        <div id="CONTAINER_PROBEPLAYER_PANEL"></div>
                    </div>
                    <div id="SETTINGS_AREA" class="settings_area"></div>
                    <div class="develop">
                        <div class="develop_unit">Scan
                            <button class="DEVELOP_COMMAND_BUTTON" id="COMMAND_PROVE_DEVICE_MANAGER_SCAN">Scan</button>
                            <button class="DEVELOP_COMMAND_BUTTON" id="COMMAND_DEVELOP_PROVE_DEVICE_MANAGER_DUMP_STATUS">Status</button>
                            <button class="DEVELOP_COMMAND_BUTTON" id="COMMAND_DEVELOP_PROVE_DEVICE_MANAGER_TEST_SCAN_ON">ScanOn</button>
                            <button class="DEVELOP_COMMAND_BUTTON" id="COMMAND_DEVELOP_PROVE_DEVICE_MANAGER_TEST_SCAN_OFF">ScanOff</button>
                        </div>
                        <div class="develop_unit">Cards
                            <button class="DEVELOP_COMMAND_BUTTON" id="COMMAND_DEVELOP_PROVE_DEVICE_MANAGER_DEBUG_DEAL_CARD">HoleCard</button>
                            <button class="DEVELOP_COMMAND_BUTTON" id="COMMAND_DEVELOP_PROVE_DEVICE_MANAGER_DEBUG_FLOP">Flop</button>
                            <button class="DEVELOP_COMMAND_BUTTON" id="COMMAND_DEVELOP_PROVE_DEVICE_MANAGER_DEBUG_TURN">Turn</button>
                            <button class="DEVELOP_COMMAND_BUTTON" id="COMMAND_DEVELOP_PROVE_DEVICE_MANAGER_DEBUG_RIVER">River</button>
                        </div>
                        <div class="develop_unit">Stats
                            <button class="DEVELOP_COMMAND_BUTTON" id="COMMAND_DEVELOP_TOGGLE_EXCLUDE_FROM_STATS">Stats</button>
                            <span id="DEVELOP_EXCLUDE_FROM_STATS_STATUS" class="DEVELOP_EXCLUDE_FROM_STATS_STATUS">Stats: ON</span>
                        </div>
                    </div>
                </div>
                <div class="monitor_screen">
                    <div id="GUIDE_OVERLAY" class="guide_overlay"></div>
                    <div id="CONTAINER_MONITORPLAYER_PANEL"></div>
                    <div id="CONTAINER_MONITORDEALER_PANEL"></div>
                </div>
            </div>
        </p>
        <p>
            <div class="templates">
                <p>
                    <div class="TEMPLATE_PROBEPLAYER_PANEL">
                        <div class="TEMPLATE_PROBEPLAYER_PANEL_NAME">
                            <div class="TEMPLATE_PROBEPLAYER_PANEL_NAME_LABEL">name:</div>
                            <div class="TEMPLATE_PROBEPLAYER_PANEL_NAME_VALUE">value</div>
                        </div>
                        <div class="TEMPLATE_PROBEPLAYER_PANEL_NICK">
                            <div class="TEMPLATE_PROBEPLAYER_PANEL_NICK_LABEL">name:</div>
                            <input class="TEMPLATE_PROBEPLAYER_PANEL_NICK_INPUT" placeholder="nickname">
                        </div>
                        <div class="TEMPLATE_PROBEPLAYER_PANEL_STATUS">
                            <div class="TEMPLATE_PROBE_PANEL_STATUS_LABEL">status:</div>
                            <div class="TEMPLATE_PROBE_PANEL_STATUS_VALUE">value</div>
                        </div>
                        <div class="TEMPLATE_PROBEPLAYER_PANEL_BATTERY">
                            <div class="TEMPLATE_PROBE_PANEL_BATTERY_LABEL">🔋</div>
                            <div class="TEMPLATE_PROBE_PANEL_BATTERY_VALUE">value</div>
                        </div>
                        <div class="TEMPLATE_PROBEPLAYER_PANEL_HOLECARD">
                            <div class="TEMPLATE_PROBEPLAYER_PANEL_HOLECARD_VALUE">
                                <img class="TEMPLATE_GLOBAL_CARD_SMALL" src="../Assets/UI/cards_pc-0.png">
                                <img class="TEMPLATE_GLOBAL_CARD_SMALL" src="../Assets/UI/cards_pc-0.png">
                            </div>
                        </div>
                        <div class="TEMPLATE_PROBEPLAYER_PANEL_LASTUPDATE">
                            <div class="TEMPLATE_PROBE_PANEL_LASTUPDATE_LABEL">status:</div>
                            <div class="TEMPLATE_PROBE_PANEL_LASTUPDATE_VALUE">value</div>
                        </div>
                        <div class="TEMPLATE_PROBEPLAYER_PANEL_CONTROL">
                            <button class="TEMPLATE_PROBEPLAYER_PANEL_CONTROL_ALIVE TEMPLATE_STANDARD_BUTTON_STYLE">Alive</button>
                            <button class="TEMPLATE_PROBE_PANEL_CONTROL_RESCAN TEMPLATE_STANDARD_BUTTON_STYLE">Rescan</button>
                            <button class="TEMPLATE_PROBEPLAYER_PANEL_CONTROL_SAVE_STATS TEMPLATE_STANDARD_BUTTON_STYLE">Save</button>
                            <button class="TEMPLATE_PROBEPLAYER_PANEL_CONTROL_LOAD_STATS TEMPLATE_STANDARD_BUTTON_STYLE">Load</button>
                        </div>
                        <div class="TEMPLATE_PROBEPLAYER_PANEL_SEAT">
                            <button class="TEMPLATE_PROBEPLAYER_PANEL_CONTROL_POSITION TEMPLATE_STANDARD_BUTTON_STYLE">Position</button>
                        </div>
                        <div class="TEMPLATE_PROBEPLAYER_PANEL_ACTION">
                            <button class="TEMPLATE_PROBEPLAYER_PANEL_ACTION_FOLD TEMPLATE_STANDARD_BUTTON_STYLE">Fold</button>
                            <button class="TEMPLATE_PROBEPLAYER_PANEL_ACTION_CHECK TEMPLATE_STANDARD_BUTTON_STYLE">Check</button>
                            <button class="TEMPLATE_PROBEPLAYER_PANEL_ACTION_CALL TEMPLATE_STANDARD_BUTTON_STYLE">Call</button>
                            <button class="TEMPLATE_PROBEPLAYER_PANEL_ACTION_AGGRESSIVE TEMPLATE_STANDARD_BUTTON_STYLE">Bet</button>
                            <button class="TEMPLATE_PROBEPLAYER_PANEL_ACTION_ALLIN TEMPLATE_STANDARD_BUTTON_STYLE">All</button>
                        </div>
                    </div>
                </p>
                <p>
                    <div class="TEMPLATE_PROBEDEALER_PANEL">
                        <div class="TEMPLATE_PROBEDEALER_PANEL_HANDCOUNT">
                            <div class="TEMPLATE_PROBEDEALER_PANEL_HANDCOUNT_LABEL">Hand:</div>
                            <input class="TEMPLATE_PROBEDEALER_PANEL_HANDCOUNT_INPUT" placeholder="hand">
                        </div>
                        <div class="TEMPLATE_PROBEDEALER_PANEL_BETTINGROUND">
                            <button class="TEMPLATE_PROBEDEALER_PANEL_BETTINGROUND_DEAL TEMPLATE_STANDARD_BUTTON_STYLE">Deal</button>
                            <button class="TEMPLATE_PROBEDEALER_PANEL_BETTINGROUND_PREFLOP TEMPLATE_STANDARD_BUTTON_STYLE">Preflop</button>
                            <button class="TEMPLATE_PROBEDEALER_PANEL_BETTINGROUND_FLOP TEMPLATE_STANDARD_BUTTON_STYLE">Flop</button>
                            <button class="TEMPLATE_PROBEDEALER_PANEL_BETTINGROUND_TURN TEMPLATE_STANDARD_BUTTON_STYLE">Turn</button>
                            <button class="TEMPLATE_PROBEDEALER_PANEL_BETTINGROUND_RIVER TEMPLATE_STANDARD_BUTTON_STYLE">River</button>
                            <button class="TEMPLATE_PROBEDEALER_PANEL_BETTINGROUND_END TEMPLATE_STANDARD_BUTTON_STYLE">End</button>
                        </div>
                        <div class="TEMPLATE_PROBEDEALER_PANEL_CONTROL">
                            <button class="TEMPLATE_PROBE_PANEL_CONTROL_RESCAN TEMPLATE_STANDARD_BUTTON_STYLE">Rescan</button>
                            <button class="TEMPLATE_PROBEDEALER_PANEL_CONTROL_NEXT_HAND TEMPLATE_STANDARD_BUTTON_STYLE">Next Hand</button>
                            <button class="TEMPLATE_MONITORDEALER_PANEL_STATS_BUTTON TEMPLATE_STANDARD_BUTTON_STYLE">Stats</button>
                        </div>
                        <div class="TEMPLATE_PROBEDEALER_PANEL_STATUS">
                            <div class="TEMPLATE_PROBE_PANEL_STATUS_LABEL">status:</div>
                            <div class="TEMPLATE_PROBE_PANEL_STATUS_VALUE">value</div>
                        </div>
                        <div class="TEMPLATE_PROBEDEALER_PANEL_BATTERY">
                            <div class="TEMPLATE_PROBE_PANEL_BATTERY_LABEL">🔋</div>
                            <div class="TEMPLATE_PROBE_PANEL_BATTERY_VALUE">value</div>
                        </div>
                        <div class="TEMPLATE_PROBEDEALER_PANEL_BOARD">
                            <div class="TEMPLATE_PROBEDEALER_PANEL_FLOP_VALUE">
                                <img class="TEMPLATE_GLOBAL_CARD_SMALL" src="../Assets/UI/cards_pc-0.png">
                                <img class="TEMPLATE_GLOBAL_CARD_SMALL" src="../Assets/UI/cards_pc-0.png">
                                <img class="TEMPLATE_GLOBAL_CARD_SMALL" src="../Assets/UI/cards_pc-0.png">
                            </div>
                            <div class="TEMPLATE_PROBEDEALER_PANEL_TURN_VALUE">
                                <img class="TEMPLATE_GLOBAL_CARD_SMALL" src="../Assets/UI/cards_pc-0.png">
                            </div>
                            <div class="TEMPLATE_PROBEDEALER_PANEL_RIVER_VALUE">
                                <img class="TEMPLATE_GLOBAL_CARD_SMALL" src="../Assets/UI/cards_pc-0.png">
                            </div>
                        </div>
                        <div class="TEMPLATE_PROBEDEALER_PANEL_BLIND">
                            <select class="TEMPLATE_PROBEDEALER_PANEL_BLIND_SELECT"></select>
                        </div>
                        <div class="TEMPLATE_PROBEDEALER_PANEL_LASTUPDATE">
                            <div class="TEMPLATE_PROBE_PANEL_LASTUPDATE_LABEL">status:</div>
                            <div class="TEMPLATE_PROBE_PANEL_LASTUPDATE_VALUE">value</div>
                        </div>
                        <div class="TEMPLATE_PROBEDEALER_PANEL_DECKLIST"></div>
                    </div>
                </p>
                <p>
                    <div class="TEMPLATE_MONITORPLAYER_PANEL">
                        <div class="TEMPLATE_MONITORPLAYER_PANEL_DRAGABLE_ROOT">
                            <div class="TEMPLATE_MONITORPLAYER_PANEL_LAYOUT_ROOT">
                                <div class="TEMPLATE_MONITORPLAYER_PANEL_NAME_VALUE">Name</div>
                                <div class="TEMPLATE_MONITORPLAYER_PANEL_GROUP_NORMAL">
                                    <div class="TEMPLATE_MONITORPLAYER_PANEL_WINRATE_VALUE">100%</div>
                                    <div class="TEMPLATE_MONITORPLAYER_PANEL_ACTION_VALUE">Bet</div>
                                    <div class="TEMPLATE_MONITORPLAYER_PANEL_POSITION_VALUE">D</div>
                                    <div class="TEMPLATE_MONITORPLAYER_PANEL_HOLECARD">
                                        <div class="TEMPLATE_MONITORPLAYER_PANEL_HOLECARD_VALUE">
                                            <img class="TEMPLATE_GLOBAL_CARD_SMALL" src="../Assets/UI/cards_pc-0.png">
                                            <img class="TEMPLATE_GLOBAL_CARD_SMALL" src="../Assets/UI/cards_pc-0.png">
                                        </div>
                                    </div>
                                </div>
                                <div class="TEMPLATE_MONITORPLAYER_PANEL_GROUP_STATS">
                                    <div class="TEMPLATE_MONITORPLAYER_PANEL_STATS_HANDCOUNT_VALUE">Hands: 0</div>
                                    <div class="TEMPLATE_MONITORPLAYER_PANEL_STATS_VPIP_VALUE">VPIP: 0%</div>
                                    <div class="TEMPLATE_MONITORPLAYER_PANEL_STATS_PFR_VALUE">PFR: 0%</div>
                                    <div class="TEMPLATE_MONITORPLAYER_PANEL_STATS_3BET_VALUE">3BET: 0%</div>
                                    <canvas class="TEMPLATE_MONITORPLAYER_PANEL_STATS_HANDRANGE_CANVAS" width="45" height="45"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </p>
                <p>
                    <div class="TEMPLATE_MONITORDEALER_PANEL">
                        <div class="TEMPLATE_MONITORDEALER_PANEL_DRAGABLE_ROOT">
                            <div class="TEMPLATE_MONITORDEALER_PANEL_LAYOUT_ROOT">
                                <div class="TEMPLATE_MONITORDEALER_PANEL_HANDCOUNT">Hand:</div>
                                <div class="TEMPLATE_MONITORDEALER_PANEL_BLIND">SB/BB</div>
                                <div class="TEMPLATE_MONITORDEALER_PANEL_BOARD">
                                    <div class="TEMPLATE_PROBEDEALER_PANEL_FLOP_VALUE">
                                        <img class="TEMPLATE_GLOBAL_CARD_SMALL" src="../Assets/UI/cards_pc-0.png">
                                        <img class="TEMPLATE_GLOBAL_CARD_SMALL" src="../Assets/UI/cards_pc-0.png">
                                        <img class="TEMPLATE_GLOBAL_CARD_SMALL" src="../Assets/UI/cards_pc-0.png">
                                    </div>
                                    <div class="TEMPLATE_PROBEDEALER_PANEL_TURN_VALUE">
                                        <img class="TEMPLATE_GLOBAL_CARD_SMALL" src="../Assets/UI/cards_pc-0.png">
                                    </div>
                                    <div class="TEMPLATE_PROBEDEALER_PANEL_RIVER_VALUE">
                                        <img class="TEMPLATE_GLOBAL_CARD_SMALL" src="../Assets/UI/cards_pc-0.png">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </p>
                <p></p>
            </div>
        </p>
    </body>
</html>
