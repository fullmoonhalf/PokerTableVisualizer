<!DOCTYPE html>
<html>
    <head>
        <link type="text/css" rel="stylesheet" href="./style.css">
        <script src="./winrate.js" type="text/javascript"></script>
        <script src="./PokerTableMonitor.js" type="text/javascript"></script>
        <title>Poker Table Monitor Browser</title>
    </head>
    <body>
        <div id="all">
            <div id="sector_global">
            </div>
            <div id="sector_player">
            </div>
            <div id="sector_command">
                <p>
                    <button id="command_add_probe">Add Probe</button>
                    <button id="command_next_hand">Next Hand</button>
                    <button id="command_dump_status">Dump Status</button>
                    <button id="command_test">Test</button>
                </p>
                <p>
                    <div class="panel_player">
                        <div class="panel_player_name_value">test</div>
                        <div class="panel_player_position_value">
                            <button class="panel_player_position_exist panel_player_position_exist_seat_open"></button>
                            <div class="panel_player_position_name">-</div>
                            <button class="panel_player_position_dealer_button"></button>
                        </div>
                        <div class="panel_player_hand_value">
                            <img class="panel_player_hand_image_style" src="../Assets/UI/cards_pc-10.png">
                            <img class="panel_player_hand_image_style" src="../Assets/UI/cards_pc-11.png">
                        </div>
                        <div class="panel_player_action_input">
                            <div class="aaa">
                                <div class="panel_player_log_action">
                                    p: raise<br>
                                    f: check - raise<br>
                                    t: check<br>
                                    r: check
                                </div>
                            </div>
                        </div>                        
                        <div class="panel_player_log_value">
                            <div class="panel_player_log_unit">
                                <div class="panel_player_log_count">1</div>
                                <div class="panel_player_log_hand">
                                    <img class="panel_player_log_hand_image_style" src="../Assets/UI/cards_pc-11.png">
                                    <img class="panel_player_log_hand_image_style" src="../Assets/UI/cards_pc-11.png">
                                </div>
                                <div class="panel_player_log_action">
                                    BB<br>
                                    p: raise<br>
                                    f: check - raise<br>
                                    t: check<br>
                                    r: check
                                </div>
                            </div>
                        </div>                        
                    </div>
                </p>
            </div>
            <div id="output">
            </div>
            <script>
            var output = document.getElementById('output');

            var deck = WinRate.genDeck();
            var cards = [];

            // １枚抽選
            function pick()
            {
                var r = Math.floor(Math.random() * deck.length);
                return deck.splice(r, 1)[0];
            }
            // 表示
            function log(mes)
            {
                output.innerText += mes + "\n";
            }

            // ボード
            var board = [pick(), pick(), pick()];
            log("board: " + WinRate.dispCards(board));

            // 計算
            var calced = WinRate.calc(
                // ハンド
                [
                    [pick(), pick()],
                    [pick(), pick()],
                    [pick(), pick()],
                ],
                // ボード
                board);

            for(var i=0; i<calced.infos.length; i++)
            {
                var info = calced.infos[i];
                log(WinRate.dispCards(info.hand) + " win:" + info.win + "/" + info.comb);
            }

            </script>
        </div>
    </body>
</html>
